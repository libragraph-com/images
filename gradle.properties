# The series' one daemon line (C-BUILD-LOGIC §3b checkDaemonArgs): identical in every repo, so one daemon serves the walk.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:G1PeriodicGCInterval=30000 -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10 --enable-native-access=ALL-UNNAMED
org.gradle.daemon.idletimeout=300000
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.console=plain
