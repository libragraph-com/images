# The series' one daemon line (C-BUILD-LOGIC §3b checkDaemonArgs): identical in every repo, so one daemon serves the walk.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC --enable-native-access=ALL-UNNAMED
org.gradle.daemon.idletimeout=1800000
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.console=plain
